<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Vivido Rich Text Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <style>
      /* Must match VIVIDO_EDITOR_PAPER_BG (#f5f0e6) used by the RN editor frame. */
      :root, html, body, #root { margin: 0; padding: 0; background: #f5f0e6; }
      body {
        color: #3d2c1e;
        font-family: system-ui, -apple-system, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.65;
        font-weight: 400;
      }
      #root > div:nth-of-type(1) {
        position: relative; height: auto; min-height: 120px; overflow: visible; width: 100%;
        background: #f5f0e6;
      }
      #root > div.dynamic-height { height: auto; overflow: visible; }
      #root div .ProseMirror {
        min-height: 120px;
        height: auto;
        overflow: visible;
        box-sizing: border-box;
        padding: 12px 16px 24px;
        color: #3d2c1e;
        background: transparent;
        font: inherit;
        font-weight: 400;
      }
      #root div .ProseMirror p { margin: 0 0 8px; }
      #root div .ProseMirror p:last-child { margin-bottom: 0; }
      #root div .ProseMirror strong { font-weight: 700; }
      #root div .ProseMirror em { font-style: italic; }
      #root div .ProseMirror mark { background: #fff2a8; color: inherit; }
      #root div.dynamic-height .ProseMirror { height: auto; }
      .ProseMirror:focus { outline: none; }
    </style>
  </body>
</html>
